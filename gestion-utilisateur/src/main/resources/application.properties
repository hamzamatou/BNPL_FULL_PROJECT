# =============================================================================
# gestion-utilisateur — UIB BNPL
# Fichier en UTF-8 (évite MalformedInputException au build Maven / STS)
# =============================================================================

spring.application.name=gestion-utilisateur
server.port=8080

# Encodage HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -----------------------------------------------------------------------------
# PostgreSQL — à adapter à ta machine / Docker
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/uib_gestion_utilisateur
spring.datasource.username=uib_user
spring.datasource.password=uib_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# JWT (HS256) — même valeur exacte que gestion-demande si tu partages les tokens
# Minimum 32 caractères. En prod : secret fort + variables d'environnement.
# -----------------------------------------------------------------------------
jwt.secret=change-me-use-at-least-32-chars!!-bnpl-shared

# -----------------------------------------------------------------------------
# Appels inter-services (ex. gestion-demande → GET /api/internal/...)
# Header : X-Internal-Api-Key
# -----------------------------------------------------------------------------
internal.api.key=dev-internal-key-change-in-prod
notification-service.url=http://localhost:8082

# reporting-archivage — audit connexion / déconnexion (Feign + X-Internal-Api-Key)
reporting-archivage.url=http://localhost:8083
app.audit.reporting.enabled=true


# E-mails via notification-service uniquement
app.mail.enabled=false
app.front.base-url=http://localhost:4200

# RabbitMQ (notification async)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=bnpl
spring.rabbitmq.password=bnpl123
app.rabbit.notification.exchange=notification.exchange
app.rabbit.notification.queue=notification.email.send
app.rabbit.notification.routing-key=notification.email.request
app.notifications.async.enabled=true

# -----------------------------------------------------------------------------
# Premier compte ADMIN (si aucun utilisateur avec role=ADMIN en base)
# En production : app.admin.bootstrap.enabled=false et créer l’admin autrement
# -----------------------------------------------------------------------------
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=admin@uib.bnpl
app.admin.bootstrap.password=ChangeMeAdmin2026!

# -----------------------------------------------------------------------------
# Logs (dev : DEBUG sur ton package si besoin)
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.tn.uib.bnpl.gestion_utilisateur=INFO
logging.level.org.springframework.security=DEBUG