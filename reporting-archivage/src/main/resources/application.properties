# =============================================================================
# reporting-archivage — UIB BNPL (UTF-8)
# =============================================================================

spring.application.name=reporting-archivage
server.port=8083

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/uib_reporting_archivage
spring.datasource.username=uib_user
spring.datasource.password=uib_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Si HTTP 500 au démarrage : exécuter scripts/fix-grants-existing-db.sql (PostgreSQL 15+)

# LocalDateTime en ISO-8601 (évite le format tableau [année, mois, …] côté Angular)
spring.jackson.serialization.write-dates-as-timestamps=false

# -----------------------------------------------------------------------------
# JWT HS256 — même secret que gestion-utilisateur / gestion-demande
# -----------------------------------------------------------------------------
jwt.secret=change-me-use-at-least-32-chars!!-bnpl-shared

# -----------------------------------------------------------------------------
# Inter-services
# -----------------------------------------------------------------------------
internal.api.key=dev-internal-key-change-in-prod
gestion-demande.url=http://localhost:8081
gestion-utilisateur.url=http://localhost:8080

# -----------------------------------------------------------------------------
# RabbitMQ — événements d'audit (BPM, gestion-demande)
# -----------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=bnpl
spring.rabbitmq.password=bnpl123

app.rabbit.audit.exchange=audit.exchange
app.rabbit.audit.queue=audit.events
app.rabbit.audit.routing-key=audit.event

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.tn.uib.bnpl.reporting_archivage=INFO
