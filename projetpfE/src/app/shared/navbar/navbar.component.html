<header class="header-wrap">
  <div class="header-accent" aria-hidden="true"></div>

  <div class="header-bar">
    <a class="brand" [routerLink]="homeLink()" (click)="closeMobileMenu()">
      <span class="brand-logo-frame">
        <img
          class="uib-logo-img"
          [src]="logoSrc"
          alt="Union Internationale de Banques"
          decoding="async"
        />
      </span>
      <span class="brand-copy">
        <span class="brand-tag">Portail BNPL</span>
        <span class="brand-sub">Union Internationale de Banques</span>
      </span>
    </a>

    @if (hasNav) {
      <button
        type="button"
        class="nav-toggle"
        [class.is-open]="mobileMenuOpen"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-controls="main-nav"
        aria-label="Menu"
        (click)="toggleMobileMenu()"
      >
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav
        id="main-nav"
        class="top-nav"
        [class.is-open]="mobileMenuOpen"
        aria-label="Navigation principale"
      >
        <div class="top-nav-pill">
          @for (link of navLinks; track link.route; let i = $index) {
            <a
              [routerLink]="link.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
              class="top-nav-item"
              [style.--nav-i]="i"
              (click)="closeMobileMenu()"
            >
              <span class="nav-icon" [class]="'nav-icon--' + link.icon" aria-hidden="true"></span>
              <span class="nav-label">{{ link.label }}</span>
            </a>
          }
        </div>
      </nav>
    }

    <div class="header-actions">
      <span class="header-divider" aria-hidden="true"></span>
      <div class="profile-badge" [attr.title]="userName || undefined">
        <span class="profile-avatar" aria-hidden="true">{{ userInitial }}</span>
        <span class="profile-meta">
          <span class="user-role">{{ roleLabel || 'Utilisateur' }}</span>
          <span class="user-name">{{ userName || '—' }}</span>
        </span>
      </div>
      <button type="button" class="logout-btn" (click)="onLogout($event)">
        <span class="logout-icon" aria-hidden="true"></span>
        <span class="logout-label">Déconnexion</span>
      </button>
    </div>
  </div>
</header>

@if (mobileMenuOpen) {
  <div class="nav-backdrop" aria-hidden="true" (click)="closeMobileMenu()"></div>
}
