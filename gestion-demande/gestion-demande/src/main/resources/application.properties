# =============================================================================
# gestion-demande — UIB BNPL (UTF-8)
# =============================================================================

spring.application.name=gestion-demande
server.port=8081

# Encodage HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/uib_gestion_demande
spring.datasource.username=uib_user
spring.datasource.password=uib_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Hibernate 6 : dialecte PostgreSQL détecté automatiquement (ligne optionnelle)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# JWT HS256 — MÊME secret que gestion-utilisateur (jwt.secret), pas Keycloak
# Ne PAS définir spring.security.oauth2.resourceserver.jwt.issuer-uri ici :
# il entre en conflit avec JwtDecoderConfig (secret partagé).
# -----------------------------------------------------------------------------
jwt.secret=change-me-use-at-least-32-chars!!-bnpl-shared

# -----------------------------------------------------------------------------
# Appels vers gestion-utilisateur (Feign)
# -----------------------------------------------------------------------------
gestion-utilisateur.url=http://localhost:8080
notification-service.url=http://localhost:8082
reporting-archivage.url=http://localhost:8083
# >>> AJOUT SERVICE IA <<<
scoring.service.url=http://localhost:8090
scoring.banques.service.url=http://localhost:8092
internal.api.key=dev-internal-key-change-in-prod

# Feign → micro IA (8090) : aligné sur service-coherence-ocr/test_micro.mjs
# (timeoutSec défaut 600 s → AbortSignal.timeout(600_000 ms)).
spring.cloud.openfeign.client.config.scoring-service.connect-timeout=20000
spring.cloud.openfeign.client.config.scoring-service.read-timeout=600000


# -----------------------------------------------------------------------------
# MinIO
# -----------------------------------------------------------------------------
minio.url=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin123
minio.bucket=bnpl-documents

# -----------------------------------------------------------------------------
# Mail — ne pas committer de mot de passe en clair : utiliser l’environnement
#
# Exemple PowerShell avant lancement :
#   $env:MAIL_USERNAME="votre@gmail.com"
#   $env:MAIL_PASSWORD="motdepasseapplication"   # sans espaces (16 car. Google)
#   $env:APP_MAIL_ENABLED="true"    # ou app.mail.enabled=true dans ce fichier
#
# Les e-mails partent uniquement via notification-service (RabbitMQ).
# -----------------------------------------------------------------------------
app.mail.enabled=false

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.tn.uib.bnpl.gestion_demande=INFO

# -----------------------------------------------------------------------------
# RabbitMQ (notification async) — broker Docker mappe sur 5673 (voir docker-compose.yaml)
# -----------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=bnpl
spring.rabbitmq.password=bnpl123

app.rabbit.notification.exchange=notification.exchange
app.rabbit.notification.queue=notification.email.send
app.rabbit.notification.routing-key=notification.email.request

app.audit.rabbit.enabled=true
app.rabbit.audit.exchange=audit.exchange
app.rabbit.audit.routing-key=audit.event

app.notifications.async.enabled=true
app.front.base-url=http://localhost:4200

# -----------------------------------------------------------------------------
# Camunda 7 (Docker : http://localhost:8087/engine-rest)
# -----------------------------------------------------------------------------
camunda.enabled=true
camunda.base-url=http://localhost:8087/engine-rest
camunda.process-key=Process_BNPL
camunda.worker-id=gestion-demande

camunda.bpm.client.base-url=${camunda.base-url}
camunda.bpm.client.worker-id=${camunda.worker-id}
camunda.bpm.client.async-response-timeout=30000
camunda.bpm.client.lock-duration=60000
