# =============================================================================
# gestion-demande — UIB BNPL (UTF-8)
# =============================================================================

spring.application.name=gestion-demande
server.port=8081

# Encodage HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/uib_gestion_demande
spring.datasource.username=uib_user
spring.datasource.password=uib_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Hibernate 6 : dialecte PostgreSQL détecté automatiquement (ligne optionnelle)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# JWT HS256 — MÊME secret que gestion-utilisateur (jwt.secret), pas Keycloak
# Ne PAS définir spring.security.oauth2.resourceserver.jwt.issuer-uri ici :
# il entre en conflit avec JwtDecoderConfig (secret partagé).
# -----------------------------------------------------------------------------
jwt.secret=change-me-use-at-least-32-chars!!-bnpl-shared

# -----------------------------------------------------------------------------
# Appels vers gestion-utilisateur (Feign)
# -----------------------------------------------------------------------------
gestion-utilisateur.url=http://localhost:8080
internal.api.key=dev-internal-key-change-in-prod

# -----------------------------------------------------------------------------
# MinIO
# -----------------------------------------------------------------------------
minio.url=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin123
minio.bucket=bnpl-documents

# -----------------------------------------------------------------------------
# Mail — ne pas committer de mot de passe en clair : utiliser l’environnement
#
# Exemple PowerShell avant lancement :
#   $env:MAIL_USERNAME="votre@gmail.com"
#   $env:MAIL_PASSWORD="motdepasseapplication"   # sans espaces (16 car. Google)
#   $env:APP_MAIL_ENABLED="true"    # ou app.mail.enabled=true dans ce fichier
#
# Si app.mail.enabled=false : pas d’envoi réel (logs seulement), pas de 500.
# Mettre à true pour envoyer réellement les mails (consentement, OTP).
# -----------------------------------------------------------------------------
app.mail.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hamzamaatougui06@gmail.com
spring.mail.password=zryd ilrb csyt fetm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.tn.uib.bnpl.gestion_demande=INFO

# -----------------------------------------------------------------------------
# RabbitMQ (notification async)
# -----------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=bnpl
spring.rabbitmq.password=bnpl123

app.rabbit.notification.exchange=notification.exchange
app.rabbit.notification.queue=notification.email.send
app.rabbit.notification.routing-key=notification.email.request

# Feature flag: publication async vers Rabbit (désactivée par défaut)
app.notifications.async.enabled=true
